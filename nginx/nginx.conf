# nginx.conf

events { worker_connections 1024; }

http {
    server {
        listen 80;

        # 1. Redirection vers FastAPI
        location /api/ {
            proxy_pass http://fastapi_api:8000/; # Le '/' final est important
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Redirection vers Airflow
        location /airflow/ {
            proxy_pass http://airflow_webserver:8080/airflow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Redirection vers Streamlit (Racine)
        location / {
            proxy_pass http://streamlit_catalog:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Ces 3 lignes sont CRUCIALES pour Streamlit (Websockets)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 4. ROUTE POUR MAILHOG (Interface Web)
        location /mail/ {
            # On utilise le nom du service Docker 'mailhog' et son port web 8025
            proxy_pass http://mailhog:8025/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Mailhog utilise parfois des connexions persistantes
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}